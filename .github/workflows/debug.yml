name: diagnose-executor-revert

# TEMPORARY diagnosis workflow — runs the suite under multiple Xcodes and
# publishes the full test log to a ci-diag branch so it can be read without
# runner log access. Delete once the root cause is fixed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix:
    name: swift test under Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.5", "26.6"]
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: swift build
        run: swift build

      - name: swift test
        run: |
          xcrun swift --version | head -2 | while IFS= read -r l; do echo "::notice::[xcode ${{ matrix.xcode }}] $l"; done
          set +e
          LOG="$RUNNER_TEMP/sm-test.log"
          swift test 2>&1 | tee "$LOG"
          st=${PIPESTATUS[0]}
          set -e
          echo "::notice::[xcode ${{ matrix.xcode }}] swift test exit=$st log_lines=$(wc -l < "$LOG" | tr -d ' ')"
          echo "Test Suite summary: $(grep -E \"Test Suite 'All tests'|Executed [0-9]+ tests\" "$LOG" | tail -4 | tr '\n' ' ')" | while IFS= read -r l; do echo "::notice::[xcode ${{ matrix.xcode }}] ${l:0:400}"; done
          grep -E "Test Suite '.*' failed|error:|failed \([0-9]+ test|Fatal error|Crash" "$LOG" | head -25 | while IFS= read -r l; do echo "::error::[xcode ${{ matrix.xcode }}] ${l:0:300}"; done
          exit $st

      - name: publish log to ci-diag branch
        if: always()
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          BR="ci-diag-${{ matrix.xcode }}"
          git checkout -q -B "$BR"
          cp "$RUNNER_TEMP/sm-test.log" "diag-xcode-${{ matrix.xcode }}.log"
          git add "diag-xcode-${{ matrix.xcode }}.log"
          git commit -qm "diag: full swift test log under Xcode ${{ matrix.xcode }}"
          git push -q origin "$BR" --force
