name: diagnose-executor-revert

# TEMPORARY diagnosis workflow — runs the suite under multiple Xcodes to find
# the toolchain whose diagnostic surface matches the pinned fixtures.
# Delete once the root cause is fixed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    name: swift test under Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.5", "26.6"]
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: swift test
        run: |
          xcrun swift --version | head -2 | while IFS= read -r l; do echo "::notice::[xcode ${{ matrix.xcode }}] $l"; done
          set +e
          swift test 2>&1 | tee .build/sm-test.log
          st=${PIPESTATUS[0]}
          set -e
          echo "::notice::[xcode ${{ matrix.xcode }}] exit=$st suites: $(grep -c "Test Suite .* passed" .build/sm-test.log || true) passed, $(grep -c "Test Suite .* failed" .build/sm-test.log || true) failed"
          grep -E "error:|Test Suite '.*' failed" .build/sm-test.log | head -20 | while IFS= read -r l; do echo "::error::[xcode ${{ matrix.xcode }}] ${l:0:300}"; done
          exit $st
