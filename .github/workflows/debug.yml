name: diagnose-acp-loop

# TEMPORARY — runs only the ACP executor-loop test, publishing the full log
# (including the executor progress lines the test now prints) to ci-diag.
# Delete after diagnosis.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acp:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: swift build
        run: swift build
      - name: ACP loop test
        run: |
          set +e
          swift test --filter ACPAdapterTests 2>&1 | tee "$RUNNER_TEMP/acp.log"
          st=${PIPESTATUS[0]}
          mkdir -p .build && cp "$RUNNER_TEMP/acp.log" .build/
          exit 0
      - name: publish
        if: always()
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git checkout -q -B ci-diag-26.6
          cp "$RUNNER_TEMP/acp.log" .
          git add acp.log
          git commit -qm "diag: acp loop log"
          git push -q origin ci-diag-26.6 --force
