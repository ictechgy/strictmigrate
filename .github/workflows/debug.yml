name: diagnose-region-flip

# TEMPORARY — captures three consecutive verbose measures of the
# DemoConcurrency fixture to see where the single region diagnostic lands
# and what it says. Publishes to ci-diag-26.6. Delete after diagnosis.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  region-flip:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: swift build
        run: swift build
      - name: measure x3
        run: |
          set +e
          {
            TOOL="$GITHUB_WORKSPACE/.build/debug/strictmigrate"
            DBG="$RUNNER_TEMP/demo"
            rm -rf "$DBG" && mkdir -p "$DBG"
            cp -R "$GITHUB_WORKSPACE/Examples/DemoConcurrency/Package.swift" "$GITHUB_WORKSPACE/Examples/DemoConcurrency/Sources" "$DBG/"
            cd "$DBG"
            for n in 1 2 3; do
              echo "########## RUN $n ##########"
              "$TOOL" measure --verbose
              echo "---- region lines in raw log ----"
              grep -nE "region|sending" .strictmigrate/last-build.log | head -15
              rm -rf .strictmigrate strictmigrate.yaml.journal
            done
          } > "$RUNNER_TEMP/region-flip.log" 2>&1
          exit 0
      - name: publish
        if: always()
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git checkout -q -B ci-diag-26.6
          cp "$RUNNER_TEMP/region-flip.log" .
          git add region-flip.log
          git commit -qm "diag: region flip data"
          git push -q origin ci-diag-26.6 --force
