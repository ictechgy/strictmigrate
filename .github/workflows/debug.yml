name: diagnose-executor-revert

# TEMPORARY diagnosis workflow — runs the suite under multiple Xcodes to find
# the toolchain whose diagnostic surface matches the pinned fixtures.
# Delete once the root cause is fixed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    name: swift test under Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.5", "26.6"]
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: swift build
        run: swift build

      - name: swift test
        run: |
          xcrun swift --version | head -2 | while IFS= read -r l; do echo "::notice::[xcode ${{ matrix.xcode }}] $l"; done
          set +e
          LOG="$RUNNER_TEMP/sm-test.log"
          swift test 2>&1 | tee "$LOG"
          st=${PIPESTATUS[0]}
          set -e
          echo "::notice::[xcode ${{ matrix.xcode }}] swift test exit=$st"
          grep -E "Test Suite|Suite '.*' failed|error:|failed \(" "$LOG" | head -25 | while IFS= read -r l; do echo "::error::[xcode ${{ matrix.xcode }}] ${l:0:300}"; done
          tail -20 "$LOG" | while IFS= read -r l; do echo "::notice::[xcode ${{ matrix.xcode }}] tail: ${l:0:200}"; done
          exit $st
