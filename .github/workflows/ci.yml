name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The tool's verdicts and fixture counts are pinned against the Swift 6.4 /
      # Xcode 27 diagnostic surface — keep the runner on the latest stable Xcode.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: swift build
        run: swift build

      # Full suite including integration tests (real toolchain builds of the
      # example packages). STRICTMIGRATE_SKIP_INTEGRATION is deliberately unset.
      - name: swift test
        run: swift test
