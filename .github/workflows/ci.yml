name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The tool's verdicts and fixture counts are pinned against the Swift 6.4 /
      # Xcode 27 diagnostic surface — keep the runner on the latest stable Xcode.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: swift build
        run: swift build

      # Full suite including integration tests (real toolchain builds of the
      # example packages). STRICTMIGRATE_SKIP_INTEGRATION is deliberately unset.
      # Failures are re-emitted as annotations so the failing tests are visible
      # without downloading raw logs.
      - name: swift test
        run: |
          xcrun swift --version | head -2 | while IFS= read -r l; do echo "::notice::$l"; done
          set +e
          swift test 2>&1 | tee .build/sm-test.log
          st=$?
          set -e
          grep -E "error:|Test Suite '.*' failed|failed \([0-9]+ test" .build/sm-test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $st
